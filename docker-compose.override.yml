# Puts every service in its own network, created outside compose. docker compose reads this
# file automatically next to docker-compose.yml, so create the networks once before `up`:
#
#   docker network create arxiv-resanity-web
#   docker network create arxiv-resanity-updater
#   docker network create arxiv-resanity-mail
#
# web      only its own network. a reverse proxy running in docker can join it and use
#          http://web:8000; the 127.0.0.1:${PORT} binding for a proxy on the host stays
# updater  its own network (arXiv, Hugging Face), plus mail's, to hand over the digests
# mail     its own network: delivers to the recipients' servers, reachable only from updater
# Other names: set WEB_NETWORK / UPDATER_NETWORK / MAIL_NETWORK in .env.

services:
  web:
    networks:
      web:
        aliases: [arxiv-resanity-web]
  updater:
    networks:
      updater: {}
      mail: {}
  mail:
    networks:
      mail: {}

networks:
  web:
    external: true
    name: ${WEB_NETWORK:-arxiv-resanity-web}
  updater:
    external: true
    name: ${UPDATER_NETWORK:-arxiv-resanity-updater}
  mail:
    external: true
    name: ${MAIL_NETWORK:-arxiv-resanity-mail}
