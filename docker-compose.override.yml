# Puts all services on one network of their own, created outside compose, instead of the
# default one. docker compose reads this file automatically next to docker-compose.yml, so
# create the network once before `up`:
#
#   docker network create --ipv6=false arxiv-resanity
#
# An nginx in docker joins the same network (`docker network connect arxiv-resanity <nginx>`)
# and proxies to http://arxiv-resanity-web:8000, the web container's name. The
# 127.0.0.1:${PORT} binding for a proxy on the host stays. Another name: RESANITY_NETWORK in .env.

services:
  web:
    networks: [resanity]
  updater:
    networks: [resanity]
  mail:
    networks: [resanity]

networks:
  resanity:
    external: true
    name: ${RESANITY_NETWORK:-arxiv-resanity}
