# Arxiv Resanity behind a reverse proxy that terminates https (see README, "Serve it publicly").
#
#   cp .env.example .env   # and edit
#   docker compose up -d --build
#
# web      gunicorn on 127.0.0.1:${PORT}, for the proxy to forward to
# updater  fetches new papers and recomputes features once a day, sends the weekly digest
# mail     (profile "mail", COMPOSE_PROFILES=mail) outgoing-only postfix + dkim for the digest
# Both share the data directory, a bind mount so the corpus can be prepared on the host
# (import_snapshot.py, gpu_embed.sh) and backed up like any other files.

x-common: &common
  restart: unless-stopped
  # logs are rotated, at most 3 x 10 MB per service (the privacy policy says so)
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ${DATA_PATH:-./data}:/app/data
  environment: &env
    TZ: ${TZ:-UTC}

services:
  web:
    <<: *common
    build:
      context: .
      args:
        EXTRAS: --extra serve
    image: arxiv-resanity-web
    container_name: arxiv-resanity-web  # for a proxy in docker: http://arxiv-resanity-web:8000
    ports:
      # only reachable from this machine; if the proxy runs elsewhere, put its
      # interface's address here instead of 127.0.0.1
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      <<: *env
      SECURE_COOKIES: "1"  # cookies only over https
      TRUST_PROXY: "1"  # one proxy in front: take scheme/host/client ip from X-Forwarded-*
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
      FETCH_LIMIT_USER: ${FETCH_LIMIT_USER:-200}  # papers per user per day that /import may fetch from arXiv
      FETCH_LIMIT_TOTAL: ${FETCH_LIMIT_TOTAL:-2000}
      # the web service mails the confirmation links of the double opt-in
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_TLS: ${SMTP_TLS:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # who runs the site, for /privacy and /imprint (EU law)
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_HOSTING: ${OPERATOR_HOSTING:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/about', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 30s

  updater:
    <<: *common
    build:
      context: .
      args:
        EXTRAS: --extra embed
    image: arxiv-resanity-updater
    container_name: arxiv-resanity-updater
    command: ["sh", "docker/update.sh"]
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - model-cache:/cache
    environment:
      <<: *env
      # must match the model the features were computed with, or a run embeds the whole
      # corpus again (on CPU). empty = tfidf only
      EMBED_MODEL: ${EMBED_MODEL-st:google/embeddinggemma-2}
      HF_TOKEN: ${HF_TOKEN:-}  # only for gated models; embeddinggemma-2 downloads without one
      COMPUTE_ARGS: ${COMPUTE_ARGS:---max_docs 100000}
      DAEMON_NUM: ${DAEMON_NUM:-2000}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-86400}
      COMPUTE_MIN_INTERVAL: ${COMPUTE_MIN_INTERVAL:-3600}  # features for papers users added, at most this often
      # weekly digest emails at DIGEST_SCHEDULE. off by default: turn it on once the mail DNS
      # records are in place and a test mail passes (see README)
      DIGEST_ENABLED: ${DIGEST_ENABLED:-0}
      DIGEST_SCHEDULE: ${DIGEST_SCHEDULE:-sun 08:00 Europe/Berlin}
      DIGEST_DAYS: ${DIGEST_DAYS:-7}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_TLS: ${SMTP_TLS:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

  mail:
    profiles: [mail]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    build: docker/mail
    image: arxiv-resanity-mail
    container_name: arxiv-resanity-mail
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-asl}
      RELAYHOST: ${RELAYHOST:-}
    volumes:
      - mail-dkim:/dkim  # the dkim key; its public half is in your dns, so keep it
      - mail-spool:/var/spool/postfix  # the queue, so retries survive restarts
    # no ports: only the other services can reach it, as mail:25

volumes:
  model-cache:
  mail-dkim:
  mail-spool:
