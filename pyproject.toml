[project]
name = "arxiv-resanity"
version = "0.1.0"
description = "Tag arxiv papers and get tfidf/embedding-based recommendations in a small Flask UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "flask>=3.1",
    "numpy>=2.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
]

[project.optional-dependencies]
# local embeddings (compute.py --embed_model st:...); not needed for api:/Ollama embeddings
# (pillow + torchvision: multimodal models such as embeddinggemma-2 load their image processor even for text)
embed = ["sentence-transformers>=6.0", "torch>=2.6", "torchvision", "pillow"]
# the same with CUDA torch, for a GPU machine (see gpu_embed.sh); can't be combined with embed
embed-gpu = ["sentence-transformers>=6.0", "torch>=2.6", "torchvision", "pillow"]
# enrich_daemon.py: thumbnails of figures and PDF pages, references from PDFs
enrich = ["pillow>=11", "pypdfium2>=4.30"]
bulk = [
    "pyarrow>=20",
]
# production web server (the docker image runs serve.py under gunicorn)
serve = ["gunicorn>=23"]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14", "pillow>=11", "pypdfium2>=4.30"]  # pillow, pypdfium2: tests of the enrich extra

[tool.uv]
# a collection of scripts run from the repo root, not an installable package
package = false

conflicts = [[{ extra = "embed" }, { extra = "embed-gpu" }]]

# the embed extra takes the CPU build of torch on Linux instead of the multi-GB CUDA one;
# embed-gpu takes the CUDA 12.6 build, which also runs on older drivers
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "embed", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "embed-gpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "embed", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "embed-gpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# the code keeps karpathy's style (single quotes, long lines); format only what
# is inconsistent instead of rewriting every line
line-length = 120

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# bug-finding rules only: pyflakes (unused/undefined names), syntax errors,
# bugbear (likely mistakes) and pylint errors
select = ["F", "E9", "B", "PLE"]
