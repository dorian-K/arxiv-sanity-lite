[project]
name = "arxiv-sanity-lite"
version = "0.1.0"
description = "Tag arxiv papers and get tfidf/embedding-based recommendations in a small Flask UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "flask>=3.1",
    "numpy>=2.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "sqlitedict>=2.1",
]

[project.optional-dependencies]
# local embeddings (compute.py --embed_model st:...); not needed for api:/Ollama embeddings
# (pillow + torchvision: multimodal models such as embeddinggemma-2 load their image processor even for text)
embed = ["sentence-transformers>=6.0", "torch>=2.6", "torchvision", "pillow"]
# send_emails.py
email = ["sendgrid>=6.12"]
# thumb_daemon.py (also needs ImageMagick's `convert` on PATH)
thumbs = ["requests>=2.32"]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14"]

[tool.uv]
# a collection of scripts run from the repo root, not an installable package
package = false

# the embed extra pulls in torch; on Linux take the CPU build instead of the multi-GB
# CUDA one. with a GPU, delete the torch source below and run `uv lock`
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# the code keeps karpathy's style (single quotes, long lines); format only what
# is inconsistent instead of rewriting every line
line-length = 120

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# bug-finding rules only: pyflakes (unused/undefined names), syntax errors,
# bugbear (likely mistakes) and pylint errors
select = ["F", "E9", "B", "PLE"]
