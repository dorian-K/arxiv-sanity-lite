<!DOCTYPE HTML>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Arxiv Resanity</title>
<link rel="stylesheet" type="text/css" href="/static/style.css">
<link rel="shortcut icon" type="image/png" href="/static/favicon.png" />
<script type="importmap">
{
    "imports": {
        "preact": "/static/vendor/preact-10.29.8/preact.module.js",
        "preact/hooks": "/static/vendor/preact-10.29.8/hooks/dist/hooks.module.js",
        "htm": "/static/vendor/htm-3.1.1/htm.module.js",
        "app/lib": "/static/app/lib.js",
        "app/math": "/static/app/math.js",
        "app/papers": "/static/app/papers.js",
        "app/list": "/static/app/list.js",
        "app/pages": "/static/app/pages.js",
        "app/account": "/static/app/account.js",
        "app/graph": "/static/app/graph.js"
    }
}
</script>
<script type="module" src="/static/app/app.js"></script>
</head>

<body>
<div id="app"></div>
</body>
</html>
