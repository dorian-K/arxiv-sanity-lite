<!DOCTYPE HTML>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Arxiv Resanity</title>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
<link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}" />

<script>
var user = {{ user | tojson }};
var readonly = {{ readonly | default(false) | tojson }};
</script>
{% block variables %}
{% endblock %}

</head>

<body>
<header id="header">
    <a href="/" id="home-link">Arxiv <span>Resanity</span></a>
    <nav>
        {% if user %}<a href="/digest">digest</a>{% endif %}{% if user and not readonly %}<a href="/import" title="add papers by arXiv link">add</a>{% endif %}
        <a href="/about" class="nav-secondary">about</a>
        <a href="/stats" class="nav-secondary">stats</a>
        <a href="/profile" class="{{ 'nav-user' if user else 'nav-login' }}" {% if readonly %}title="read-only view"{% endif %}>{{ ('👁 ' + user) if readonly else (user if user else 'log in') }}</a>
    </nav>
</header>

<main>
{% block content %}
{% endblock %}
</main>

<footer id="footer"><a href="/about">about</a> · <a href="/stats">stats</a></footer>

<!-- React without a build step: components are written with htm tagged templates
     (static/common.js), so no in-browser JSX compiler is needed -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script src="{{ url_for('static', filename='common.js') }}"></script>
{% block elements %}
{% endblock %}

</body>
</html>
